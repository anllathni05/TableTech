<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TableTech - Crear Cuenta</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="toast-container"></div>

  <div class="auth-wrapper">
    <div class="auth-card">
      <h2 class="auth-title">📝 Registro de Usuario</h2>
      <p style="text-align: center; font-size: 0.75rem; color: #6b7280; margin-bottom: 1.5rem;">Crea un usuario para gestionar el restaurante</p>
      
      <form id="register-form">
        <div class="form-group">
          <label>Nombre Completo</label>
          <input type="text" id="reg-name" class="form-control" placeholder="Ej. Angela Jiménez" required>
        </div>
        <div class="form-group">
          <label>Correo Electrónico</label>
          <input type="email" id="reg-email" class="form-control" placeholder="correo@ejemplo.com" required>
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="reg-pass" class="form-control" required>
        </div>
        <button type="submit" class="btn-submit" style="margin-top: 1rem;">Crear Cuenta</button>
      </form>

      <div class="auth-link">
        ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
