<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TableTech - Iniciar Sesión</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="toast-container"></div>

  <div class="auth-wrapper">
    <div class="auth-card">
      <h2 class="auth-title">🔐 Iniciar Sesión</h2>
      <p style="text-align: center; font-size: 0.75rem; color: #6b7280; margin-bottom: 1.5rem;">Accede a TableTech Sistemas</p>
      
      <form id="login-form">
        <div class="form-group">
          <label>Correo Electrónico</label>
          <input type="email" id="login-email" class="form-control" value="admin@tabletech.com" required>
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="login-pass" class="form-control" value="admin" required>
        </div>
        <button type="submit" class="btn-submit" style="margin-top: 1rem;">Ingresar al Sistema</button>
      </form>

      <div class="auth-link">
        ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
